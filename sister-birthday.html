<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عيد ميلاد سعيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Cormorant+Garamond:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a1420;
    --bg2: #0d1a2b;
    --grid: rgba(79, 209, 255, 0.08);
    --cyan: #4fd1ff;
    --cyan-dim: #2a6b85;
    --gold: #ffd166;
    --ink: #eaf2f7;
    --ink-dim: #8ea3b3;
    --card-bg: #0f2036;
    --serif: 'Cormorant Garamond', 'Amiri', serif;
    --mono: 'JetBrains Mono', 'SF Mono', monospace;
    --arabic: 'Tajawal', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--arabic);
    min-height:100%;
    overflow-x:hidden;
    position:relative;
  }
  .grid-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 42px 42px;
    animation: drift 30s linear infinite;
  }
  @keyframes drift{ from{background-position:0 0;} to{background-position:42px 42px;} }
  .glow{
    position:fixed; width:60vw; height:60vw; max-width:600px; max-height:600px;
    background: radial-gradient(circle, rgba(79,209,255,0.10), transparent 70%);
    border-radius:50%; pointer-events:none; z-index:0;
  }
  .glow.one{ top:-15%; right:-10%; }
  .glow.two{ bottom:-20%; left:-15%; background: radial-gradient(circle, rgba(255,209,102,0.07), transparent 70%); }

  main{ position:relative; z-index:1; max-width:720px; margin:0 auto; padding: 48px 20px 80px; }

  .eyebrow-row{ display:flex; align-items:center; gap:10px; color:var(--cyan); font-family:var(--mono); font-size:13px; margin-bottom:28px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); }

  h1.hero{
    font-family:var(--arabic); font-weight:700; font-size: clamp(28px, 6vw, 44px);
    line-height:1.3; margin:0 0 18px;
    color:var(--ink);
  }
  h1.hero span{ color: var(--cyan); }

  .terminal{
    background: var(--bg2);
    border:1px solid rgba(79,209,255,0.18);
    border-radius:10px;
    padding:18px 20px;
    font-family:var(--mono);
    font-size: clamp(13px, 3.2vw, 15px);
    line-height:1.9;
    color: var(--ink-dim);
    margin: 28px 0 40px;
    direction:ltr;
    text-align:left;
    overflow-x:auto;
  }
  .terminal .bar{ display:flex; gap:6px; margin-bottom:14px; }
  .terminal .bar span{ width:10px;height:10px;border-radius:50%;background:#274257; }
  .terminal .line{ opacity:0; animation: reveal 0.5s forwards; white-space:pre; }
  .terminal .key{ color: var(--cyan); }
  .terminal .str{ color: var(--gold); }
  .terminal .cmt{ color:#4a6478; }
  @keyframes reveal{ to{opacity:1;} }

  /* circuit divider */
  .circuit{ display:flex; align-items:center; gap:10px; margin: 44px 0; opacity:0.5; }
  .circuit .ln{ flex:1; height:1px; background: linear-gradient(90deg, transparent, var(--cyan-dim), transparent); }
  .circuit svg{ width:22px; height:22px; flex-shrink:0; }

  /* CARD */
  .stage{
    position:relative; display:flex; flex-direction:column; align-items:center;
    padding: 20px 0 10px; min-height: 420px;
  }
  .stars-canvas{ position:absolute; inset:-40px; pointer-events:none; z-index:5; }

  .invite-text{ font-family:var(--mono); font-size:13px; color:var(--ink-dim); margin-bottom:26px; text-align:center; }

  .card{
    width: min(340px, 84vw);
    aspect-ratio: 5/7;
    position:relative;
    cursor:pointer;
    perspective: 1400px;
    z-index:2;
  }
  .card-inner{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    transition: transform 1.1s cubic-bezier(.2,.9,.2,1);
  }
  .card.open .card-inner{ transform: rotateY(-180deg); }

  .face{
    position:absolute; inset:0;
    border-radius:14px;
    backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  .face.front{
    background:
      linear-gradient(180deg, rgba(79,209,255,0.05), transparent 40%),
      var(--card-bg);
    border: 1px solid rgba(79,209,255,0.25);
  }
  .face.front::before{
    content:"";
    position:absolute; inset:14px;
    border: 1px dashed rgba(79,209,255,0.3);
    border-radius:8px;
  }
  .gear{ width:56px; height:56px; color:var(--cyan); margin-bottom:18px; animation: spin 14s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg);} }
  .front-title{ font-family:var(--arabic); font-weight:700; font-size:19px; color:var(--ink); text-align:center; }
  .front-sub{ font-family:var(--mono); font-size:11px; color:var(--cyan); margin-top:10px; letter-spacing:0.5px; }

  .face.back{
    background: linear-gradient(160deg, #101f33, #0a1622);
    border: 1px solid rgba(255,209,102,0.3);
    transform: rotateY(180deg);
    text-align:center;
  }
  .back-msg{ font-family: var(--serif); direction:ltr; }
  .back-msg .l1{ font-size: clamp(20px,5.5vw,26px); color:var(--gold); font-weight:600; margin-bottom:14px; }
  .back-msg .l2{ font-size: clamp(15px,4vw,18px); color:var(--ink); line-height:1.7; font-weight:500; }
  .back-msg .l3{ font-size: clamp(22px,6vw,30px); color:var(--cyan); font-weight:700; margin-top:16px; }

  .hint{ margin-top:22px; font-family:var(--mono); font-size:12px; color:var(--ink-dim); text-align:center; min-height:18px; }

  footer{ text-align:center; font-family:var(--mono); font-size:11px; color: #3d5468; margin-top:60px; }

  @media (prefers-reduced-motion: reduce){
    .grid-bg{ animation:none; }
    .gear{ animation:none; }
    .card-inner{ transition: none; }
    .terminal .line{ animation:none; opacity:1; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow one"></div>
<div class="glow two"></div>

<main>
  <h1 class="hero">لكل سطر كود كتبتيه، ولكل مشكلة حليتيها بهدوء… <span>عيد ميلادك سعيد يا مهندستنا</span></h1>

  <div class="terminal" id="terminal">
    <div class="bar"><span></span><span></span><span></span></div>
  </div>

  <div class="circuit">
    <div class="ln"></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="#4fd1ff" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v7M12 15v7M2 12h7M15 12h7"/></svg>
    <div class="ln"></div>
  </div>

  <div class="stage">
    <canvas class="stars-canvas" id="stars"></canvas>

    <div class="card" id="card">
      <div class="card-inner">
        <div class="face front">
          <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
          <div class="front-title">Open gifts</div>
          <div class="front-sub">tap_to_open()</div>
        </div>
        <div class="face back">
          <div class="back-msg">
            <div class="l1">My sister love</div>
            <div class="l2">I wish you a happy year in which<br>all your wishes come true</div>
            <div class="l3">Happy birthday</div>
          </div>
        </div>
      </div>
    </div>
    <div class="hint" id="hint">اضغطي على الكرت</div>
  </div>

  <footer>made with &lt;3 for the best engineer I know</footer>
</main>

<script>
(function(){
  var lines = [
    {t:'<span class="key">const</span> sister = {', d:0},
    {t:'  <span class="str">profession</span>: <span class="str">"engineer"</span>,', d:150},
    {t:'  <span class="str">skills</span>: [<span class="str">"code"</span>, <span class="str">"logic"</span>, <span class="str">"patience"</span>],', d:300},
    {t:'  <span class="str">bugs_fixed</span>: <span class="key">Infinity</span>,', d:450},
    {t:'  <span class="cmt">// never gives up on a problem</span>', d:600},
    {t:'};', d:750},
    {t:'', d:850},
    {t:'<span class="key">function</span> celebrate(sister) {', d:950},
    {t:'  <span class="key">return</span> <span class="str">"happiest birthday ever 🎉"</span>;', d:1100},
    {t:'}', d:1250}
  ];
  var term = document.getElementById('terminal');
  lines.forEach(function(l){
    var el = document.createElement('div');
    el.className = 'line';
    el.style.animationDelay = l.d + 'ms';
    el.innerHTML = l.t || '&nbsp;';
    term.appendChild(el);
  });

  var card = document.getElementById('card');
  var hint = document.getElementById('hint');
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var opened = false;

  function resize(){
    var stage = card.closest('.stage');
    canvas.width = stage.clientWidth + 80;
    canvas.height = stage.clientHeight + 80;
  }
  window.addEventListener('resize', resize);
  resize();

  function burst(){
    var w = canvas.width, h = canvas.height;
    var cx = w/2, cy = h/2 - 20;
    var particles = [];
    var colors = ['#ffd166','#4fd1ff','#eaf2f7'];
    for(var i=0;i<70;i++){
      var ang = Math.random()*Math.PI*2;
      var speed = 2 + Math.random()*5;
      particles.push({
        x:cx, y:cy,
        vx: Math.cos(ang)*speed,
        vy: Math.sin(ang)*speed - 2,
        life: 60 + Math.random()*40,
        age:0,
        size: 2 + Math.random()*3,
        color: colors[i % colors.length],
        spin: Math.random()*Math.PI
      });
    }
    function drawStar(x,y,size,rot,color){
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(rot);
      ctx.beginPath();
      for(var k=0;k<5;k++){
        ctx.lineTo(Math.cos((18+k*72)/180*Math.PI)*size, -Math.sin((18+k*72)/180*Math.PI)*size);
        ctx.lineTo(Math.cos((54+k*72)/180*Math.PI)*size*0.45, -Math.sin((54+k*72)/180*Math.PI)*size*0.45);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }
    function step(){
      ctx.clearRect(0,0,w,h);
      var alive = false;
      particles.forEach(function(p){
        if(p.age > p.life) return;
        alive = true;
        p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.age++;
        var alpha = 1 - (p.age/p.life);
        ctx.globalAlpha = Math.max(alpha,0);
        drawStar(p.x, p.y, p.size, p.spin + p.age*0.05, p.color);
      });
      ctx.globalAlpha = 1;
      if(alive) requestAnimationFrame(step);
      else ctx.clearRect(0,0,w,h);
    }
    step();
  }

  card.addEventListener('click', function(){
    if(opened) return;
    opened = true;
    card.classList.add('open');
    hint.textContent = 'كل عام وأنتِ بخير 🩵';
    setTimeout(burst, 550);
  });
})();
</script>
</body>
</html>
